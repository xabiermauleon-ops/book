# Netlify compila el sitio en cada despliegue ejecutando el generador.
# Así lo publicado siempre sale de lo versionado: no se puede subir un
# cambio en los datos y olvidarse de reconstruir.
[build]
  publish = "public"
  command = "node build/build.js"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Direcciones limpias
[[redirects]]
  from = "/proyectos"
  to = "/trabajo.html"
  status = 301

[[redirects]]
  from = "/cv"
  to = "/cv-xabier-mauleon.pdf"
  status = 301

[[redirects]]
  from = "/contacto"
  to = "/contacto.html"
  status = 301

[[redirects]]
  from = "/en"
  to = "/en/index.html"
  status = 301
